<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
        }

        .box {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        input {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Auto AI</h1>

    <p>
        Create captions, hashtags and upload videos to TikTok.
    </p>

    <div class="box">
        <h2>Connect TikTok</h2>

        <button onclick="loginTikTok()">
            Connect with TikTok
        </button>
    </div>

    <div class="box">
        <h2>Upload Video</h2>

        <input type="file" accept="video/mp4,video/quicktime">

        <br>

        <button>
            Upload to TikTok
        </button>
    </div>
<script>
function loginTikTok() {
    const clientKey = aw7lw1qdl4y3t6n5;

    const redirectUri = encodeURIComponent(
        "https://hbui00460-del.github.io/"
    );

    const state = "autoai";

    const url =
        "https://www.tiktok.com/v2/auth/authorize/" +
        "?client_key=" + clientKey +
        "&response_type=code" +
        "&scope=user.info.basic,video.upload" +
        "&redirect_uri=" + redirectUri +
        "&state=" + state;

    window.location.href = url;
}
</script>
</body>
</html>
